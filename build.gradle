plugins {
    id 'java'
    id 'application'
}

group = 'io.atworks.specscan'
version = '1.0-SNAPSHOT'

application {
    mainClass = 'io.atworks.specscan.SpecScanDemoRunner'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.eclipse.jgit:org.eclipse.jgit:6.8.0.202311291450-r'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.15.2'
    implementation 'com.github.javaparser:javaparser-core:3.25.7'
    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.25.7'
    
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testImplementation 'net.jqwik:jqwik:1.7.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    runtimeOnly 'org.slf4j:slf4j-simple:1.7.36'
}

tasks.register('gitSpecScanJar', Jar) {
    archiveClassifier = 'git-spec'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    manifest {
        attributes 'Main-Class': 'io.atworks.specscan.GitSpecScanMain'
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.register('runWeb', JavaExec) {
    group = 'application'
    description = 'Runs the Spec Scan web UI.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.atworks.specscan.SpecScanWebServer'
}

tasks.register('runDemo', JavaExec) {
    group = 'application'
    description = 'Runs the E2E pipeline demo.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.atworks.specscan.SpecScanDemoRunner'
}

tasks.register('webSpecScanJar', Jar) {
    archiveClassifier = 'web'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    manifest {
        attributes 'Main-Class': 'io.atworks.specscan.SpecScanWebServer'
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

test {
    useJUnitPlatform()
}

tasks.register('ruleEvaluation', Test) {
    group = 'verification'
    description = 'Runs the rule-based static analysis quality gate and holdout evaluation.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'specscan.evaluation.report.path',
        layout.buildDirectory.file('reports/rule-evaluation/evaluation-report.json').get().asFile.absolutePath
    filter {
        includeTestsMatching 'io.atworks.specscan.analysis.evaluation.*'
    }
}

tasks.register('deliveryVerification', Test) {
    group = 'verification'
    description = 'Runs the Unit 07 output migration delivery and rollback gates.'
    dependsOn tasks.named('ruleEvaluation')
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.atworks.specscan.analysis.delivery.*'
    }
}

tasks.register('unit05MigrationVerification', Test) {
    group = 'verification'
    description = 'Runs focused Unit 05 cross-project migration regression tests.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.atworks.specscan.analysis.migration.*'
        includeTestsMatching 'io.atworks.specscan.analysis.output.*'
        includeTestsMatching 'io.atworks.specscan.analysis.CandidateOperationScopeTest'
        includeTestsMatching 'io.atworks.specscan.analysis.NormalizationRejectionClassifierTest'
    }
}
