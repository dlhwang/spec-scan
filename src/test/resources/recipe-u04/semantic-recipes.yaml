schema_version: 1
pack_version: core-u04
recipes:
  - id: JAVA_BINARY_FAILURE_GUARD
    family: binary_failure_guard
    steps:
      - { op: match.failure_condition, out: failure }
      - { op: match.binary_comparison, in: failure, out: comparison }
      - { op: resolve.request_input_path, in: comparison, out: target }
      - { op: bind.literal_operand, in: comparison, out: expected }
      - { op: normalize.comparison_by_failure_polarity, in: [comparison, failure], out: operator }
      - { op: emit.normalized_constraint, in: [target, operator, expected], out: constraint }
  - id: JAVA_COMPOSITE_REQUIREMENT
    family: composite_requirement
    steps:
      - { op: match.composite_requirement, out: failure }
      - { op: resolve.requirement_target, in: failure, out: target }
      - { op: bind.guard_literal, in: failure, out: expected }
      - { op: normalize.guard_operator, in: failure, out: operator }
      - { op: emit.normalized_constraint, in: [target, operator, expected], out: constraint }
  - id: JAVA_NULL_EMPTY_GUARD
    family: null_empty_guard
    steps:
      - { op: match.null_empty_guard, out: failure }
      - { op: resolve.requirement_target, in: failure, out: target }
      - { op: bind.guard_literal, in: failure, out: expected }
      - { op: normalize.guard_operator, in: failure, out: operator }
      - { op: emit.normalized_constraint, in: [target, operator, expected], out: constraint }
  - id: JDK_OPTIONAL_LOOKUP_FAILURE
    family: optional_lookup_failure
    steps:
      - { op: match.optional_lookup_failure, out: failure }
      - { op: resolve.lookup_target, in: failure, out: target }
      - { op: bind.guard_literal, in: failure, out: expected }
      - { op: normalize.guard_operator, in: failure, out: operator }
      - { op: emit.normalized_constraint, in: [target, operator, expected], out: constraint }
