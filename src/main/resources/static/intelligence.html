<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>API Intelligence Code Graph</title>
  <style>body {
    font-family: Arial;
    margin: 2rem;
    max-width: 1100px
  }

  input, button {
    padding: .7rem;
    margin: .3rem 0;
    width: 100%
  }

  button {
    cursor: pointer
  }

  .card {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 1rem;
    margin: 1rem 0
  }

  .pill {
    display: inline-block;
    background: #eef;
    padding: .25rem .5rem;
    margin: .2rem;
    border-radius: 5px
  }

  pre {
    white-space: pre-wrap;
    background: #f6f6f6;
    padding: 1rem;
    overflow: auto
  }</style>
</head>
<body><h1>API Intelligence Code Graph</h1>
<p>API별 그래프와 Evidence를 별도로 LLM에 분석합니다.</p>
<form id="f"><input id="p" required placeholder="로컬 Java 프로젝트 경로">
  <button>분석 시작</button>
</form>
<p id="s"></p>
<section id="out"></section>
<script>const f = document.getElementById('f'), s = document.getElementById('s'),
    out = document.getElementById('out');
f.onsubmit = async e => {
  e.preventDefault();
  s.textContent = '분석 중...';
  out.innerHTML = '';
  try {
    let r = await fetch('/api/intelligence', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({projectPath: document.getElementById('p').value})
    });
    let x = await r.json();
    if (!r.ok) {
      throw Error(x.error || x.message);
    }
    Object.entries(x.intelligence || {}).forEach(([id, v]) => {
      let a = v;
      out.insertAdjacentHTML('beforeend',
          `<article class="card"><h2>${id}</h2><p>PreCondition ${a.preConditions.length} · ResponseAssertion ${a.responseAssertions.length} · BusinessRule ${a.businessRules.length} · Exception ${a.exceptions.length}</p><pre>${JSON.stringify(
              a, null, 2)}</pre><details><summary>Graph / Evidence</summary><pre>${JSON.stringify(
              {graph: x.graphs[id], evidence: x.evidence[id]}, null, 2)}</pre></details></article>`)
    });
    s.textContent = '완료';
  } catch (err) {
    s.textContent = '실패: ' + err.message
  }
}</script>
</body>
</html>
